# Datacenter Layout Viewer — test workflow
#
# Two jobs rather than one, so a red mark says which layer broke: the modules
# (tests/run.mjs) or the page (tests/browser.mjs). They are independent and
# run in parallel.
#
# Both suites are passed --strict. Each of them skips sections whose tools are
# missing so they still run on a machine without python3 or Playwright, and a
# skip is exactly what CI must not accept: a green run that quietly tested
# nothing looks identical to a green run that tested everything.
#
# Every job states a timeout-minutes, several times what it takes when
# healthy, so a hang costs minutes rather than GitHub's default of six hours.
# tests/run.mjs fails if a job is added without one.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every pull request moves the version (docs/releasing.md): one that leaves
  # it where its base branch has it fails here, so a change cannot reach main
  # unnumbered. A push to main is compared with what main was before the
  # push: two pull requests that each took the same number pass their own
  # checks, and are caught only there (shared_tools BN-002).
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          read_version() { sed -n "s/^export const VERSION = '\(.*\)';$/\1/p"; }
          head=$(read_version < js/version.js)
          base=$(git show FETCH_HEAD:js/version.js | read_version)
          echo "base $BASE: $base, this pull request: $head"
          if [ -z "$head" ] || [ -z "$base" ]; then
            echo "::error file=js/version.js::could not read VERSION"; exit 1
          fi
          if [ "$head" = "$base" ] || [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n1)" != "$head" ]; then
            echo "::error file=js/version.js::the version is $head, and $BASE has $base -- every change moves the version (docs/releasing.md)"
            exit 1
          fi
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          read_version() { sed -n "s/^export const VERSION = '\(.*\)';$/\1/p"; }
          head=$(read_version < js/version.js)
          base=$(git show FETCH_HEAD:js/version.js | read_version)
          echo "main before this push ($BEFORE): $base, after: $head"
          if [ -z "$head" ] || [ -z "$base" ]; then
            echo "::error file=js/version.js::could not read VERSION"; exit 1
          fi
          if [ "$head" = "$base" ] || [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n1)" != "$head" ]; then
            echo "::error file=js/version.js::the version is $head, and main before this push had $base -- every change moves the version (docs/releasing.md)"
            exit 1
          fi

  modules:
    name: module tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # tools/dcadd, tools/dcimport, tools/dcfabric and tools/dcprobe are python3, stdlib
      # only, and ~100 of the assertions run them -- against the fixtures
      # under tests/fixtures/, and dcprobe against this runner's own /proc.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node tests/run.mjs --strict

  browser:
    name: browser tests
    # ubuntu-latest became 26.04 in November 2026, and Playwright 1.56.1
    # (pinned below) cannot install Chromium's dependencies there: "Playwright
    # does not support chromium on ubuntu26.04-x64". 24.04 it supports. Moving
    # off 24.04 means bumping Playwright first.
    runs-on: ubuntu-24.04
    # The job's ceiling has room for the install, whose apt step has taken
    # anything from 19 seconds to 10 minutes on a slow mirror; the suite's
    # own step below has a tighter one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The viewer has no dependencies and this does not give it any:
      # Playwright goes on the runner, never into the repo, and
      # tests/browser.mjs looks for it in the global root. Pinned, because an
      # unpinned browser is a test suite that changes underneath you.
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      # About 4 minutes when the page is healthy, and seconds when it does
      # not come up (the suite stops at once), so 15 is only ever a hang.
      - run: node tests/browser.mjs --strict
        timeout-minutes: 15

  package:
    name: package
    # ubuntu-latest became 26.04 in November 2026, and setup-python has no 3.9 for it; 24.04 still has every version in the matrix (quarterdeck QD-014 did the same).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # 3.9 is the floor pyproject claims. Claiming it and never running it
      # is how a f-string or a match statement gets into a tool that a RHEL
      # box is then told it can install.
      # The installed dccompact runs the wheel's js/ with the node on PATH.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # PyPI renders README.md on the project page and rejects a release
      # whose metadata it cannot render -- after the upload has started, so
      # the version is burnt. Checking here costs seconds.
      - name: Check metadata
        run: python -m twine check --strict dist/*

      # The wheel's layout is not the checkout's: the viewer's files live at
      # the repository root and are copied to dcviz/static/ at build time.
      # Nothing else in this repo exercises the copied shape, so a wheel that
      # installs and then serves an empty directory would pass every other
      # job here.
      - name: Install the wheel and use it
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install dist/*.whl
          /tmp/env/bin/dcviz --version
          /tmp/env/bin/dcadd --version
          /tmp/env/bin/dcimport --version
          /tmp/env/bin/dcfabric --version
          /tmp/env/bin/dcprobe --version
          /tmp/env/bin/dccompact --version
          # dccompact runs the wheel's own js/ with Node: compact a layout
          # through it, so a wheel missing js/dccompact.mjs fails here.
          /tmp/env/bin/dccompact -q examples/fabric/fabric.dc | grep -q 'node leaf\[1\.\.4\]'
          for f in index.html js/app.js js/version.js js/probe.js js/compact.js js/dccompact.mjs css/app.css examples/small.dc; do
            test -f "$(/tmp/env/bin/dcviz path)/$f" || { echo "missing from the wheel: $f"; exit 1; }
          done

      # An install that pulls in a dependency is a broken promise, not a
      # broken build, so nothing else would catch it.
      - name: No runtime dependencies
        run: |
          test "$(/tmp/env/bin/pip list --format=freeze | grep -cv '^\(pip\|setuptools\|wheel\|datacenter-layout-viewer\)==')" -eq 0

      - name: Serve, and fetch the page it serves
        run: |
          /tmp/env/bin/dcviz serve -p 8099 --no-browser --quiet &
          for _ in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.25; done
          curl -fsS http://127.0.0.1:8099/ | grep -q 'id="version"'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8099/js/app.js | grep -qi 'content-type: text/javascript'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
