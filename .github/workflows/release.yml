# Datacenter Layout Viewer — release workflow
# SPDX-License-Identifier: GPL-3.0-or-later
#
# A release is a tag. Pushing `v1.2.3` builds the package, checks that the
# tag matches the version the tree actually carries, attaches the artifacts
# to a GitHub release, and publishes to PyPI.
#
# The tag is not the source of the version -- python/dcviz/__init__.py is
# (with js/version.js as its pinned twin; see the note in that file). The tag
# is checked against it rather than injected into it, because a build that
# takes its version from whatever ref triggered it will happily publish
# 1.2.3 from a tree that says 1.0.0, and PyPI will never let that number be
# reused.
#
# PyPI publishing uses trusted publishing (OIDC): no token is stored here.
# It needs one piece of setup, once, at
# https://pypi.org/manage/account/publishing/ --
#   PyPI project:     datacenter-layout-viewer
#   Owner:            MartinGallagher-code
#   Repository:       datacenter_visualization
#   Workflow:         release.yml
#   Environment:      pypi
# Until that exists the publish step fails and everything before it -- the
# build, the version check, the GitHub release -- still succeeds, so the
# release is not lost.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The drift guards: js/version.js, python/dcviz/__init__.py, the
      # tools' --version and the newest CHANGELOG heading all have to agree
      # before anything is built. This is the last moment a mismatch is free
      # to fix.
      - run: node tests/run.mjs --strict

      - name: The tag is the version the tree carries
        id: check
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('python/dcviz/__init__.py').read_text()).group(1))")
          tag='${{ inputs.tag || github.ref_name }}'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag but the tree says $version -- tag the commit that carries the version, or bump the version first"
            exit 1
          fi
          grep -q "^## $version " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $version' entry"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel and use it
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install dist/*.whl
          test "$(/tmp/env/bin/dcviz --version | head -1)" \
             = "dcviz (Datacenter Layout Viewer) ${{ steps.check.outputs.version }}"
          test -f "$(/tmp/env/bin/dcviz path)/js/app.js"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The release notes are the changelog's section for this version, cut
      # out rather than written again: a summary typed twice is a summary
      # that disagrees with itself by the third release.
      - name: Notes from the changelog
        run: |
          python - <<'EOF' > notes.md
          import pathlib, re
          version = "${{ needs.build.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text()
          body = re.split(rf"^## {re.escape(version)}\b.*$", text, maxsplit=1, flags=re.M)
          section = re.split(r"^## ", body[1], maxsplit=1, flags=re.M)[0].strip()
          print(section)
          print()
          print(f"    pip install datacenter-layout-viewer=={version}")
          print()
          print("Or serve a clone: `python3 -m http.server 8000`. No dependencies either way.")
          EOF
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Datacenter Layout Viewer ${{ needs.build.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag

  pypi:
    name: publish to pypi
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datacenter-layout-viewer
    permissions:
      id-token: write          # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
