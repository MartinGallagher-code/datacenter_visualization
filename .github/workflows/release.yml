# Datacenter Layout Viewer — release workflow
#
# Releasing is one click: Actions -> release -> "Run workflow". Nothing to
# type. The workflow reads the version out of the tree, tags that commit,
# builds, makes the GitHub release and publishes to PyPI.
#
# It asks for nothing because there is nothing it could sensibly ask. The
# version lives in python/dcviz/__init__.py (with js/version.js as its pinned
# twin -- see the note in that file), so the tag is *derived* from the tree,
# never typed at it and never taken from whatever ref triggered the run. A
# release that took a typed version would happily publish 1.2.3 from a tree
# that says 1.0.1, and PyPI never lets a number be reused.
#
# Pushing a `v*` tag by hand still works and does the same thing; the tag is
# then checked against the tree instead of created from it.
#
# So the whole procedure is: bump the version (four files -- see
# docs/releasing.md), merge to main, click Run workflow.
#
# PyPI publishing uses trusted publishing (OIDC): no token is stored here.
# It needed one piece of setup, once, at
# https://pypi.org/manage/account/publishing/ --
#   PyPI project:     datacenter-layout-viewer
#   Owner:            MartinGallagher-code
#   Repository:       datacenter_visualization
#   Workflow:         release.yml
#   Environment:      pypi

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to create the tag when run from the button
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0       # tags, so an already-released version is caught
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The drift guards: js/version.js, python/dcviz/__init__.py, the tools'
      # --version, the README line and the newest CHANGELOG heading all have
      # to agree before anything is built. This is the last moment a mismatch
      # is free to fix.
      - run: node tests/run.mjs --strict

      - name: Read the version out of the tree
        id: version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('python/dcviz/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "the tree says $version"
          grep -q "^## $version " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $version' entry -- add one before releasing"; exit 1; }

      # Two ways in, one rule: the tag and the tree must end up agreeing.
      # From the button there is no tag yet, so make it. From a pushed tag
      # there is, so check it.
      - name: Tag it
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::pushed tag $GITHUB_REF_NAME but the tree says $VERSION -- tag the commit that carries the version, or bump the version first"
              exit 1
            fi
            echo "released from the pushed tag $TAG"
            exit 0
          fi

          # A version that is already tagged has already been released, and
          # PyPI would refuse the upload at the very end of the run. Say so
          # now, and say what to do about it.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists -- $VERSION is released. Bump the version (see docs/releasing.md) and run this again."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Datacenter Layout Viewer $VERSION"
          # This push does not start a second run of this workflow: GitHub
          # refuses to trigger workflows from a GITHUB_TOKEN push, which is
          # what keeps one click from becoming two releases. Do not "fix"
          # this by pushing with a PAT.
          git push origin "$TAG"
          echo "tagged $TAG at $(git rev-parse --short HEAD)"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel and use it
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install dist/*.whl
          test "$(/tmp/env/bin/dcviz --version | head -1)" \
             = "dcviz (Datacenter Layout Viewer) ${{ steps.version.outputs.version }}"
          test -f "$(/tmp/env/bin/dcviz path)/js/app.js"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The release notes are the changelog's section for this version, cut
      # out rather than written again: a summary typed twice is a summary
      # that disagrees with itself by the third release.
      - name: Notes from the changelog
        run: |
          python - <<'EOF' > notes.md
          import pathlib, re
          version = "${{ needs.build.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text()
          body = re.split(rf"^## {re.escape(version)}\b.*$", text, maxsplit=1, flags=re.M)
          section = re.split(r"^## ", body[1], maxsplit=1, flags=re.M)[0].strip()
          print(section)
          print()
          print(f"    pip install datacenter-layout-viewer=={version}")
          print()
          print("Or serve a clone: `python3 -m http.server 8000`. No dependencies either way.")
          EOF
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Datacenter Layout Viewer ${{ needs.build.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag

  pypi:
    name: publish to pypi
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datacenter-layout-viewer
    permissions:
      id-token: write          # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
