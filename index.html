<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datacenter Layout Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%234fa3ff%22/><rect x=%223%22 y=%223%22 width=%2210%22 height=%222.6%22 fill=%22%230d1117%22/><rect x=%223%22 y=%226.7%22 width=%2210%22 height=%222.6%22 fill=%22%230d1117%22/><rect x=%223%22 y=%2210.4%22 width=%2210%22 height=%222.6%22 fill=%22%230d1117%22/></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="logo"></span>
    <span id="title">Datacenter Layout Viewer</span>
  </div>

  <div class="filterwrap">
    <input id="filter" type="search" spellcheck="false" autocomplete="off"
           placeholder="filter:  +gpu  kind:rack  model=r76*  temp_c&gt;70  has:iperf  net:storage">
    <span id="filter-count" class="count"></span>
  </div>

  <div class="topactions">
    <label class="chk"><input type="checkbox" id="opt-hide"> hide non-matching</label>
    <label class="chk"><input type="checkbox" id="opt-values" checked> values</label>
    <button id="btn-fit" title="Fit to view (F)">Fit</button>
    <button id="btn-load">Load files…</button>
  </div>
</header>

<main id="stage">
  <aside id="left" class="panel">
    <section class="block">
      <h2>Structure</h2>
      <div class="btnrow">
        <button data-collapse="expand">Expand all</button>
        <button data-collapse="rack">Collapse racks</button>
        <button data-collapse="row">Collapse rows</button>
        <button data-collapse="room">Collapse rooms</button>
      </div>
      <div id="tree" class="tree"></div>
    </section>
  </aside>

  <div id="canvaswrap">
    <canvas id="view"></canvas>
    <div id="tooltip" class="tooltip" hidden></div>
    <div id="statusbar"></div>
  </div>

  <aside id="right" class="panel">
    <section class="block">
      <h2>Overlays <span id="overlay-hint" class="hint"></span></h2>
      <div id="overlays"></div>
    </section>

    <section class="block">
      <h2>Networks</h2>
      <div id="nets"></div>
      <label class="slider">link opacity
        <input type="range" id="link-opacity" min="5" max="100" value="45">
      </label>
    </section>

    <section class="block">
      <h2>Inspector</h2>
      <div id="inspector" class="inspector"><p class="muted">Click an element.</p></div>
    </section>
  </aside>
</main>

<div id="drop" class="dropzone" hidden><div>Drop <code>.dc</code> layout and <code>.tsv</code> results files</div></div>

<input type="file" id="filepicker" multiple accept=".dc,.txt,.tsv,.csv,.results" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
